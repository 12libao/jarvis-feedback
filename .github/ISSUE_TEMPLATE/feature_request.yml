name: Feature request
description: Suggest a new Jarvis workflow or capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: input
    id: report_id
    attributes:
      label: Report ID
      description: Optional. Paste the ID from Jarvis if this started from the app feedback panel.
      placeholder: rpt_20260610_xxxxxx
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      placeholder: I want Jarvis to ...
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      placeholder: Describe the ideal flow in a few steps.
  - type: dropdown
    id: importance
    attributes:
      label: Importance
      options:
        - "Blocking my workflow"
        - "Important"
        - "Nice to have"
        - "Exploratory idea"
  - type: textarea
    id: notes
    attributes:
      label: Extra context
      description: Optional public-safe context or links.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste API keys, tokens, private logs, or private session content.
          required: true
