name: Bug report
description: Report something that is not working in Jarvis.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: report_id
    attributes:
      label: Report ID
      description: Paste the ID from Jarvis if you submitted an in-app report.
      placeholder: rpt_20260610_xxxxxx
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: One or two sentences are enough.
      placeholder: Jarvis froze after I started a Codex session.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jarvis version
      placeholder: v0.5.0
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15.5 arm64 / Chrome on macOS
  - type: dropdown
    id: reproducible
    attributes:
      label: Can you reproduce it?
      options:
        - "Yes, reliably"
        - "Sometimes"
        - "Only happened once"
        - "Not sure"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Jarvis
        2. Start a Codex session
        3. ...
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste API keys, tokens, private logs, or private session content.
          required: true
