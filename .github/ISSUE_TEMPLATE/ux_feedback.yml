name: UX feedback
description: Tell us where Jarvis feels confusing, slow, or awkward.
title: "[UX] "
labels: ["ux"]
body:
  - type: input
    id: report_id
    attributes:
      label: Report ID
      description: Optional. Paste the ID from Jarvis if you submitted an in-app report.
      placeholder: rpt_20260610_xxxxxx
  - type: textarea
    id: friction
    attributes:
      label: What felt wrong?
      placeholder: The terminal looked connected, but I could not tell whether Codex was still running.
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
  - type: textarea
    id: desired_behavior
    attributes:
      label: Desired behavior
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS app / Web
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not paste API keys, tokens, private logs, or private session content.
          required: true
